name: Set up CI toolchain
description: Bun (with its dependency cache), and optionally Node 22, the checksum-pinned herdr and the Rust PTY host. Callers check out the repository first.
inputs:
  bun-version:
    description: Bun version for ci.yml, pages.yml and release.yml; the one place it is set.
    required: false
    default: '1.4.4'
  node:
    description: "'true' installs Node 22 (some test fixtures and tools are Node programs)."
    required: false
    default: 'false'
  herdr:
    description: "'true' installs the checksum-pinned herdr 0.9.3 (Linux x86_64) on PATH."
    required: false
    default: 'false'
  rust:
    description: "'true' checks that a self-hosted Linux runner's image has its pinned Rust toolchain; GitHub's images have Rust already."
    required: false
    default: 'false'
  pty-host:
    description: "'true' puts the Rust PTY host for this checkout's crates/pty-sidecar where the server finds it (Linux and macOS): the release's binary when the crate tree matches, else a cargo build. The step fails unless the server's own check takes it, so the job's terminal attaches run on it."
    required: false
    default: 'false'
  cache:
    description: "'save' restores and saves the Bun dependency cache; 'restore' only restores it, for a job that runs unpinned third-party code and must not write a cache other workflows trust; 'none' restores and saves no Actions cache, Bun's executable included, for every job of a run in which a publishing or signing job takes an artifact (pages.yml, the Release and the other publishing workflows, ci.yml when called with hosted_only) and for a job that publishes, signs or holds a secret itself: any job of a main run can write a cache under any key that later runs restore (scripts/privileged-jobs-workflow.test.ts)."
    required: false
    default: 'save'
runs:
  using: composite
  steps:
    # Keep cached files inside the checkout. Home-directory archives contain relative paths
    # that cannot be restored between GitHub's workspace and the image's shorter /w path.
    - name: Select workspace-local Bun cache
      shell: bash
      env:
        BUN_CACHE_DIR: ${{ github.workspace }}/.ci-cache/bun
      run: printf 'BUN_INSTALL_CACHE_DIR=%s\n' "$BUN_CACHE_DIR" >> "$GITHUB_ENV"
    - name: Select workspace-local hosted browser cache
      if: runner.environment != 'self-hosted'
      shell: bash
      env:
        BROWSER_CACHE_DIR: ${{ github.workspace }}/.ci-cache/playwright
      run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$BROWSER_CACHE_DIR" >> "$GITHUB_ENV"
    - name: Verify prepared self-hosted tools
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      env:
        EXPECTED_BUN_VERSION: ${{ inputs.bun-version }}
        NEED_NODE: ${{ inputs.node }}
        NEED_HERDR: ${{ inputs.herdr }}
        NEED_RUST: ${{ inputs.rust }}
      run: bash scripts/ci-preinstalled-tools.sh
    # The runner host's copy of the default branch's packages (scripts/self-hosted-runner/run.sh),
    # read-only to jobs: bun install downloads only what this checkout's lockfile adds.
    - name: Seed Bun cache from the runner host
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      run: bash scripts/ci-seed-bun-cache.sh
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: runner.environment != 'self-hosted'
      with:
        bun-version: ${{ inputs.bun-version }}
        no-cache: ${{ inputs.cache == 'none' }}
    # setup-bun installs into $HOME/.bun/bin. The self-hosted Mac runs jobs as a person's own account, whose Bun
    # that would replace, so there it installs under the job's temp folder, which the runner empties after the job.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: runner.environment == 'self-hosted' && runner.os != 'Linux'
      env:
        HOME: ${{ runner.temp }}/setup-bun-home
      with:
        bun-version: ${{ inputs.bun-version }}
        no-cache: ${{ inputs.cache == 'none' }}
    - if: inputs.node == 'true' && (runner.environment != 'self-hosted' || runner.os != 'Linux')
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        # setup-node caches by itself when package.json's packageManager names npm: never here
        package-manager-cache: false
    - name: Cache Bun dependencies
      # On the measured self-hosted connection this archive costs 37–43s to restore,
      # versus 7–20s for a fresh install. Do not pay for restore/save on disposable runners.
      if: runner.environment != 'self-hosted' && inputs.cache == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-cache/bun
        key: bun-workspace-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-workspace-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-
    - name: Restore Bun dependencies (read-only)
      if: runner.environment != 'self-hosted' && inputs.cache == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-cache/bun
        key: bun-workspace-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-workspace-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-
    # the PTY host alone (no ACP keeper beside it), only ever one built from this checkout's crates/pty-sidecar: the
    # release's for this version, checked against its manifest, into bin/; else, as between a version bump and its
    # release, the latest release's when its manifest names this crate tree; else a cargo build. The last two go where
    # the server takes a host without one in bin/ (server/pty/host.ts). A runner with none of these fails here.
    - name: Rust PTY host
      if: inputs.pty-host == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
      run: |
        if ! bun -e 'const { install } = await import("./scripts/pty-sidecar.ts"); const result = await install(); console.log(result.message); process.exit(result.ok ? 0 : 1)'; then
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "::error::no Rust PTY host is built for $RUNNER_OS $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          tree=$(git rev-parse HEAD:crates/pty-sidecar)
          tag=$(curl -fsSI --retry 3 "https://github.com/$REPOSITORY/releases/latest" | tr -d '\r' | sed -n 's|^[Ll]ocation: .*/releases/tag/||p')
          manifest=$( [ -z "$tag" ] || curl -fsSL --retry 3 "https://github.com/$REPOSITORY/releases/download/$tag/ovis-pty-sidecar.json" || true)
          out=crates/pty-sidecar/target/release
          if [ -n "$manifest" ] && [ "$(jq -r .crate <<<"$manifest")" = "$tree" ]; then
            mkdir -p "$out"
            curl -fsSL --retry 3 "https://github.com/$REPOSITORY/releases/download/$tag/$(jq -r --arg p "$platform" '.assets[$p].file' <<<"$manifest")" -o "$out/ovis-pty-sidecar"
            echo "$(jq -r --arg p "$platform" '.assets[$p].sha256' <<<"$manifest")  $out/ovis-pty-sidecar" | sha256sum -c -
            chmod +x "$out/ovis-pty-sidecar"
          elif command -v cargo >/dev/null; then
            cargo build --release --locked --manifest-path crates/pty-sidecar/Cargo.toml
          else
            echo "::error::no released Rust PTY host for crate tree $tree, and no cargo on this runner to build one (a self-hosted image from before its Rust layer: rebuild scripts/self-hosted-runner/Dockerfile)" >&2
            exit 1
          fi
        fi
        bun -e 'const { rustSidecar } = await import("./server/pty/host.ts"); process.exit(rustSidecar() ? 0 : 1)'
    - name: Install checksum-pinned herdr 0.9.3
      if: inputs.herdr == 'true' && runner.environment != 'self-hosted'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/herdr-bin"
        curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
        echo "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
        chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
        echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
