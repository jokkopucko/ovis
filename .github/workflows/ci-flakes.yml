name: CI flakes
# Once a day, the browser scripts that failed or passed only on their automatic second run in the last
# 24 hours of ci.yml runs, ranked, in one open issue that each run rewrites: scripts/ci-flakes-issue.ts
# (docs/development.md, "ci-flakes"). It reads runs, jobs, logs and annotations and writes that issue only.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-flakes
  cancel-in-progress: false
jobs:
  report:
    name: Report flaky browser scripts
    if: github.repository == 'devswha/ovis'
    # GitHub-hosted: it needs gh and Bun only, and holds issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          cache: none
      - name: Update the CI flakes issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci-flakes-issue.ts --hours 24 --repo "$REPO"
