name: Rust PTY host binaries
# For Release, and for a repair run dispatched from the tag it builds, the attest job then signs each
# binary's build provenance (gh attestation verify --repo devswha/ovis), so an install can tell the bytes
# came from this workflow and not only that they match the manifest beside them; a called workflow may
# not ask for more permissions than its caller grants, so both callers grant id-token and attestations.
on:
  pull_request:
    paths:
      - 'crates/pty-sidecar/**'
      - 'scripts/pty-sidecar.ts'
      - 'server/pty/**'
      - '.github/workflows/pty-sidecar.yml'
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pty-sidecar-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-x64, os: ubuntu-24.04 }
          - { asset: linux-arm64, os: ubuntu-24.04-arm }
          - { asset: darwin-universal, os: macos-15 }
    runs-on: ${{ fromJSON(matrix.os == 'macos-15' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_MAC_LABELS || toJSON(matrix.os)) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        env:
          HOME: ${{ runner.temp }}/setup-bun-home
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Rust unit tests
        run: cargo test --locked --manifest-path crates/pty-sidecar/Cargo.toml
      - name: Build ${{ matrix.asset }}
        run: bun scripts/pty-sidecar.ts build ${{ matrix.asset }} pty-sidecar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          package-manager-cache: false
      - if: runner.os == 'Linux'
        run: bun install --frozen-lockfile
      - name: PtySession on the built binary, beside the Node sidecar
        if: runner.os == 'Linux'
        env:
          HERDR_TEST_MODE: unit
          OVIS_PTY_SIDECAR: rust
          OVIS_PTY_SIDECAR_BIN: ${{ github.workspace }}/pty-sidecar/ovis-pty-sidecar-${{ matrix.asset }}
        run: bun test ./server/pty/host.test.ts ./server/pty/session.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pty-sidecar-${{ matrix.asset }}
          path: pty-sidecar/*
          if-no-files-found: error
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pty-sidecar-*
          path: pty-sidecar
          merge-multiple: true
      - run: bun scripts/pty-sidecar.ts manifest pty-sidecar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ovis-pty-sidecar
          path: pty-sidecar/*
          if-no-files-found: error
  # Pull requests build without signing; a release cannot publish until this job has attested. The
  # provenance names the run's own ref and commit, so a repair dispatched from another ref than the
  # tag it builds attests nothing rather than a source the binaries were not built from.
  attest:
    needs: manifest
    if: github.event_name != 'pull_request' && (inputs.ref == github.sha || inputs.ref == github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ovis-pty-sidecar
          path: pty-sidecar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pty-sidecar/ovis-pty-sidecar-*
