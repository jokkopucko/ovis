name: Remote PC bundles
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      # no bundle carries a unit test or a note: the Windows smoke's own test file is the one they run
      - '!server/**/*.test.ts'
      - '!shared/**/*.test.ts'
      - '!server/**/*.md'
      - 'server/windows-native.test.ts'
      - 'scripts/build-remote-bundle.ts'
      - 'scripts/server-artifact.ts'
      - 'scripts/install-*-integration.ts'
      - 'integrations/**'
      - 'scripts/remote-bundle-smoke.ts'
      - 'scripts/pty-sidecar.ts'
      - 'crates/pty-sidecar/**'
      - 'scripts/ssh-*.ts'
      - 'scripts/ci-ssh-checks.sh'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/remote-bundles.yml'
      - '.github/actions/setup-ci/**'
  workflow_dispatch:
  push:
    tags: ['remote-v*']
permissions:
  contents: read
concurrency:
  group: remote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A pull request builds and smokes the Linux x64 bundle here (bundle-linux); the arm64 and macOS ones run in
  # remote-bundles-platforms.yml, only for a change to what differs between platforms. In two weeks of pull
  # request runs (1,269, to 2026-11-21) those three jobs failed alone nine times, never in the smoke step.
  bundle:
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, pty: linux-x64 }
          - { os: ubuntu-24.04-arm, pty: linux-arm64 }
          - { os: macos-15, pty: darwin-universal }
          - { os: macos-15-intel, pty: darwin-universal }
    runs-on: ${{ fromJSON(matrix.os == 'macos-15' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_MAC_LABELS || toJSON(matrix.os)) }}
    env:
      HERDR_BUNDLE_PTY_SIDECAR: ${{ github.workspace }}/pty-sidecar/ovis-pty-sidecar-${{ matrix.pty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          bun-version: 1.4.4
          node: 'true'
          cache: none
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      - run: bun scripts/pty-sidecar.ts build ${{ matrix.pty }} pty-sidecar
      - run: bun run scripts/build-remote-bundle.ts
      - run: bun run scripts/remote-bundle-smoke.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-${{ matrix.os }}
          path: remote-bundles/*
  # A pull request's Linux job also assembles the Windows bundle that smoke-windows starts and runs the SSH checks:
  # what bundle-windows and ssh do for a tag or a manual run, on one hosted runner instead of three. Each part runs
  # whatever became of the others, as it did in a job of its own: the Windows bundle goes up first, and smoke-windows
  # starts on its upload, not on this job's result.
  bundle-linux:
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      HERDR_BUNDLE_PTY_SIDECAR: ${{ github.workspace }}/pty-sidecar/ovis-pty-sidecar-linux-x64
    outputs:
      windows: ${{ steps.windows-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          bun-version: 1.4.4
          node: 'true'
          cache: none
      - run: bun install --frozen-lockfile
      - id: common
        run: bun run typecheck && bun run build
      # in a folder of its own, so the artifact holds the Windows bundle alone, as bundle-windows' does
      - name: Windows bundle
        env:
          HERDR_BUNDLE_OUTPUT: remote-bundles-win32
        run: bun run scripts/build-remote-bundle.ts win32-x64
      - id: windows-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-win32-x64
          path: remote-bundles-win32/*
      # the Linux bundle and its smoke, whatever became of the Windows bundle
      - id: pty-host
        if: "!cancelled() && steps.common.outcome == 'success'"
        run: bun scripts/pty-sidecar.ts build linux-x64 pty-sidecar
      - id: linux-bundle
        if: "!cancelled() && steps.pty-host.outcome == 'success'"
        run: bun run scripts/build-remote-bundle.ts
      - if: "!cancelled() && steps.linux-bundle.outcome == 'success'"
        run: bun run scripts/remote-bundle-smoke.ts
      # the ssh job's bundle has no Rust PTY host, so its remote PC runs the Node one: the same here, whatever became
      # of the Windows bundle, the Rust PTY host or the smoke
      - id: node-bundle
        name: Linux bundle without the Rust PTY host
        if: "!cancelled() && steps.common.outcome == 'success'"
        env:
          HERDR_BUNDLE_PTY_SIDECAR: ''
        run: bun run scripts/build-remote-bundle.ts
      - name: OpenSSH server
        if: "!cancelled() && steps.node-bundle.outcome == 'success'"
        run: bash scripts/ci-ssh-checks.sh server
      - name: SSH integration
        if: "!cancelled() && steps.node-bundle.outcome == 'success'"
        run: bash scripts/ci-ssh-checks.sh integration
      - name: SSH password in a disposable container
        if: "!cancelled() && steps.node-bundle.outcome == 'success'"
        run: bash scripts/ci-ssh-checks.sh password
  bundle-windows:
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    # release publishes its bundle: GitHub-hosted whatever the runner variables say, and no shared cache (scripts/privileged-jobs-workflow.test.ts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      - run: bun run scripts/build-remote-bundle.ts win32-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-win32-x64
          path: remote-bundles/*
  smoke-windows:
    timeout-minutes: 20
    # the Windows bundle of this run: bundle-linux uploads it for a pull request, bundle-windows otherwise
    needs: [bundle-linux, bundle-windows]
    if: "!cancelled() && (needs.bundle-linux.outputs.windows != '' || needs.bundle-windows.result == 'success')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-win32-x64
          path: remote-bundles
      - name: Install herdr with its own installer
        shell: cmd
        run: curl.exe -fsSLo install.cmd https://herdr.dev/install.cmd && install.cmd && del install.cmd
      - run: bun run scripts/remote-bundle-smoke.ts
        shell: pwsh
      # what only a real Windows PC shows: its process table and its path rules (server/windows-native.test.ts)
      - run: bun install --frozen-lockfile
      - name: Windows-only code on Windows
        shell: pwsh
        env:
          HERDR_TEST_MODE: unit
        run: bun test ./server/windows-native.test.ts
  ssh:
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: OpenSSH server
        run: bash scripts/ci-ssh-checks.sh server
      - run: bun install --frozen-lockfile && bun run build && bun run scripts/build-remote-bundle.ts
      - name: SSH integration
        run: bash scripts/ci-ssh-checks.sh integration
      - name: SSH password in a disposable container
        run: bash scripts/ci-ssh-checks.sh password
  release:
    # every job it needs passed, said outright: smoke-windows also waits for bundle-linux, which a tag skips, and the
    # implicit success() would skip this job behind it (scripts/workflow-needs.test.ts)
    if: "!cancelled() && startsWith(github.ref, 'refs/tags/remote-v') && needs.bundle.result == 'success' && needs.smoke-windows.result == 'success' && needs.ssh.result == 'success'"
    needs: [bundle, smoke-windows, ssh]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true
      - name: Merge pinned platform checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          version = os.environ['RELEASE_TAG'].removeprefix('remote-v')
          result = {'version': version, 'assets': {}}
          for path in glob.glob('bundles/manifest-*.json'):
              data = json.load(open(path))
              assert data['version'] == version
              for platform, asset in data['assets'].items():
                  asset['url'] = 'https://github.com/' + os.environ['REPOSITORY'] + '/releases/download/' + os.environ['RELEASE_TAG'] + '/' + asset['url']
                  result['assets'][platform] = asset
          assert len(result['assets']) == 5
          json.dump(result, open('bundles/manifest.json', 'w'), indent=2)
          PY
      - name: Publish versioned bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" bundles/*.tgz bundles/manifest.json --title "$RELEASE_TAG" --notes 'SSH remote bridge runtimes with SHA-256 manifest.' --latest=false
