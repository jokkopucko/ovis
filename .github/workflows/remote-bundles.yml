name: Remote PC bundles
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'scripts/build-remote-bundle.ts'
      - 'scripts/server-artifact.ts'
      - 'scripts/install-*-integration.ts'
      - 'integrations/**'
      - 'scripts/remote-bundle-smoke.ts'
      - 'scripts/pty-sidecar.ts'
      - 'crates/pty-sidecar/**'
      - 'scripts/ssh-*.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/remote-bundles.yml'
      - '.github/actions/setup-ci/**'
  workflow_dispatch:
  push:
    tags: ['remote-v*']
permissions:
  contents: read
concurrency:
  group: remote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bundle:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, pty: linux-x64 }
          - { os: ubuntu-24.04-arm, pty: linux-arm64 }
          - { os: macos-15, pty: darwin-universal }
          - { os: macos-15-intel, pty: darwin-universal }
    runs-on: ${{ fromJSON(matrix.os == 'macos-15' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_MAC_LABELS || toJSON(matrix.os)) }}
    env:
      HERDR_BUNDLE_PTY_SIDECAR: ${{ github.workspace }}/pty-sidecar/ovis-pty-sidecar-${{ matrix.pty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          bun-version: 1.4.4
          node: 'true'
          cache: none
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      - run: bun scripts/pty-sidecar.ts build ${{ matrix.pty }} pty-sidecar
      - run: bun run scripts/build-remote-bundle.ts
      - run: bun run scripts/remote-bundle-smoke.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-${{ matrix.os }}
          path: remote-bundles/*
  bundle-windows:
    timeout-minutes: 20
    # release publishes its bundle: GitHub-hosted whatever the runner variables say, and no shared cache (scripts/privileged-jobs-workflow.test.ts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      - run: bun run scripts/build-remote-bundle.ts win32-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-win32-x64
          path: remote-bundles/*
  smoke-windows:
    timeout-minutes: 20
    needs: bundle-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-win32-x64
          path: remote-bundles
      - name: Install herdr with its own installer
        shell: cmd
        run: curl.exe -fsSLo install.cmd https://herdr.dev/install.cmd && install.cmd && del install.cmd
      - run: bun run scripts/remote-bundle-smoke.ts
        shell: pwsh
      # what only a real Windows PC shows: its process table and its path rules (server/windows-native.test.ts)
      - run: bun install --frozen-lockfile
      - name: Windows-only code on Windows
        shell: pwsh
        env:
          HERDR_TEST_MODE: unit
        run: bun test ./server/windows-native.test.ts
  ssh:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # the self-hosted image already ships sshd (and has no sudo); a hosted runner installs it
      - name: OpenSSH server
        run: |
          if [ -x /usr/sbin/sshd ] && [ -d /run/sshd ]; then
            echo "sshd is already installed"
          else
            sudo bash scripts/ci-bounded-retry.sh 300 bash -c 'apt-get update && apt-get install -y openssh-server' && sudo mkdir -p /run/sshd
          fi
      - run: bun install --frozen-lockfile && bun run build && bun run scripts/build-remote-bundle.ts
      # password mode creates an account and starts sshd as root; without sudo (the self-hosted image) the
      # key-only flow runs, with sshd as the runner user on a port of its own
      - name: SSH integration
        run: |
          if sudo -n true 2>/dev/null; then export SSH_TEST_PASSWORD=1; fi
          bun run scripts/ssh-integration.ts
      - name: SSH password in a disposable container
        run: |
          if docker info >/dev/null 2>&1; then bun run scripts/ssh-password-docker.ts; else echo "::notice::no Docker here, password flow skipped"; fi
  release:
    if: startsWith(github.ref, 'refs/tags/remote-v')
    needs: [bundle, smoke-windows, ssh]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true
      - name: Merge pinned platform checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          version = os.environ['RELEASE_TAG'].removeprefix('remote-v')
          result = {'version': version, 'assets': {}}
          for path in glob.glob('bundles/manifest-*.json'):
              data = json.load(open(path))
              assert data['version'] == version
              for platform, asset in data['assets'].items():
                  asset['url'] = 'https://github.com/' + os.environ['REPOSITORY'] + '/releases/download/' + os.environ['RELEASE_TAG'] + '/' + asset['url']
                  result['assets'][platform] = asset
          assert len(result['assets']) == 5
          json.dump(result, open('bundles/manifest.json', 'w'), indent=2)
          PY
      - name: Publish versioned bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" bundles/*.tgz bundles/manifest.json --title "$RELEASE_TAG" --notes 'SSH remote bridge runtimes with SHA-256 manifest.' --latest=false
