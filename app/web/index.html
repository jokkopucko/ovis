<!doctype html>
<html lang="en" class="screens">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ovis</title>
  <!-- one theme-color, which Android reads for the system bars' icons: connect.js (followScheme) sets it to the screen's colour -->
  <meta name="theme-color" content="#12100e">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- data-ko: the Korean text of the element, put in as text by localize() (shell.js) on a Korean
       phone, so markup inside a sentence gets its own element. Three screens, one shown at a time
       (connect.js show): the sign-in, Add a PC (also "Start without signing in"), and an address. -->
  <main id="sign-in" class="first">
    <img class="sheep" src="ovis-sheep.svg" alt="Ovis" width="76" height="76">
    <h1><span data-ko="PC를 어디서나.">Your PCs, anywhere.</span> <span class="quiet" data-ko="Ovis 계정에 로그인">Sign in to your Ovis account</span></h1>
    <!-- the sign-ins the account service names (connect.js showProviders); GitHub alone until it answers -->
    <div id="account" class="providers">
      <button type="button" class="provider" data-provider="github"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg><span>GitHub</span></button>
      <button type="button" class="provider" data-provider="google" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google</span></button>
      <button type="button" class="provider" data-provider="apple" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span>Apple</span></button>
    </div>
    <p class="note" data-ko="처음이면 계정이 바로 만들어져요">First time? Your account is made right away.</p>
    <button type="button" class="link" id="no-account" data-ko="로그인 없이 시작">Start without signing in</button>
  </main>
  <main id="add" class="first" hidden>
    <button type="button" class="back" data-back aria-label="Back" data-ko-label="뒤로"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="badge"><img src="ovis-sheep.svg" alt="" width="56" height="56"></span>
    <h1 class="step" data-ko="PC 추가">Add a PC</h1>
    <div class="ways">
      <button type="button" class="way" id="scan"><span class="way-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 20h2M20 14v2" stroke-linecap="round"/></g></svg></span><span class="way-text"><span class="way-title" data-ko="QR 찍기">Scan a QR code</span><span class="sub" data-ko="PC 화면의 QR">The QR on the PC&#39;s screen</span></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="way" id="address-way"><span class="way-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" stroke-linejoin="round"/></g></svg></span><span class="way-text"><span class="way-title" data-ko="주소 입력">Enter an address</span><span class="sub">Tailscale · Wi-Fi</span></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="way" id="ssh-way"><span class="way-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7l5 5-5 5M12 18h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="way-text"><span class="way-title" data-ko="SSH">SSH</span><span class="sub">user@host</span></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <section id="saved-section" hidden>
      <h2 data-ko="내 PC">Your PCs</h2>
      <ul id="saved"></ul>
    </section>
  </main>
  <main id="address-screen" class="first" hidden>
    <button type="button" class="back" data-back aria-label="Back" data-ko-label="뒤로"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 class="step" data-ko="주소 입력">Enter an address</h1>
    <form id="connect" novalidate>
      <input id="address" name="address" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://my-pc.tailnet.ts.net" autocomplete="url" aria-label="PC address" data-ko-label="PC 주소">
      <button type="submit" class="primary" id="open" data-ko="열기">Open</button>
    </form>
  </main>
  <!-- what an open does, on whichever screen is up (connect.js show moves it): the status text stays in the page,
       empty until an open starts, since a live region that appears with its text is not announced (connect.js showStatus) -->
  <div id="feedback">
    <div class="status">
      <span class="spinner" id="spinner" aria-hidden="true" hidden></span>
      <span id="status-text" role="status"></span>
      <button type="button" id="cancel" data-ko="취소" hidden>Cancel</button>
    </div>
    <p class="error" id="error" role="alert"></p>
  </div>
  <script type="module" src="connect.js"></script>
</body>
</html>
