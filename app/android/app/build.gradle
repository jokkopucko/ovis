apply plugin: 'com.android.application'

// The hosted shell's origin (BuildConfig.APP_ORIGIN): the one `bun run build:web` gave the app's pages
// from OVIS_APP_URL, written to hosted-origin.properties (app/scripts/hosted-origin.ts), else app.ovis.sh.
// BuildConfig.HOME_HOSTED: the app's first screen is the hosted Connect a PC screen, unless that run had
// OVIS_APP_HOME=bundled, which keeps the app's own page as the first screen.
// BuildConfig.SHELL_BUNDLED: the app serves the hosted shell from the copy it carries (app/bundled-shell, written by
// `bun run build:web`: app/scripts/bundled-shell.ts) at APP_ORIGIN itself, unless that run had OVIS_APP_SHELL=hosted,
// which loads it from the network there as before (a preview app, the QA twin): never the store app (below).
def hostedOrigin = new Properties()
def hostedOriginFile = file("hosted-origin.properties")
if (hostedOriginFile.isFile()) hostedOriginFile.withInputStream { hostedOrigin.load(it) }
def appOrigin = hostedOrigin.getProperty("appOrigin", "https://app.ovis.sh")
def homeHosted = hostedOrigin.getProperty("appHome", "hosted") != "bundled"
def shellBundled = hostedOrigin.getProperty("appShell", "bundled") != "hosted"
def shellAssets = file("../../bundled-shell")

// Packaging fails when the pages copied into the app (`bunx cap sync android`) name another origin or were built for
// another first screen: `bun run build:web` for the other platform's build rewrites hosted-origin.properties without
// copying pages here.
def checkHostedOrigin = tasks.register("checkHostedOrigin") {
    def shellJs = file("src/main/assets/public/shell.js")
    doLast {
        def declared = java.util.regex.Pattern.compile('(?m)^export const APP_ORIGIN = "([^"]*)";$').matcher(shellJs.isFile() ? shellJs.text : "")
        def pages = declared.find() ? declared.group(1) : null
        if (pages != appOrigin) {
            throw new GradleException("${shellJs} names ${pages ?: 'no hosted origin'} and BuildConfig.APP_ORIGIN is ${appOrigin}: run `bun run build:web` with the OVIS_APP_URL this build is for, then `bunx cap sync android`")
        }
        def builtFor = java.util.regex.Pattern.compile('(?m)^export const APP_HOME = "([^"]*)";$').matcher(shellJs.isFile() ? shellJs.text : "")
        def pagesHome = builtFor.find() ? builtFor.group(1) : null
        def nativeHome = homeHosted ? "hosted" : "bundled"
        if (pagesHome != nativeHome) {
            throw new GradleException("${shellJs} was built for ${pagesHome ? "the ${pagesHome}" : 'no'} first screen and BuildConfig.HOME_HOSTED says ${nativeHome}: run `bun run build:web` with the OVIS_APP_HOME this build is for, then `bunx cap sync android`")
        }
        def carried = new File(shellAssets, "shell/index.html").isFile() && new File(shellAssets, "shell-policy.json").isFile()
        if (shellBundled && !carried) {
            throw new GradleException("BuildConfig.SHELL_BUNDLED is true and ${shellAssets} holds no shell: run `bun run build:web` (OVIS_APP_SHELL_ARCHIVE, _SHA256 and _TAG name a release's shell, OVIS_APP_SHELL_DIR a folder, else it builds one from this checkout), then `bunx cap sync android`. OVIS_APP_SHELL=hosted loads the shell from the network instead, never in a store build")
        }
        // the policies the app sends with the shell (BundledShell.policiesOf refuses the same at run time)
        if (shellBundled) {
            def policy = null
            try { policy = new groovy.json.JsonSlurper().parse(new File(shellAssets, "shell-policy.json")) } catch (Exception unreadable) {}
            def page = policy instanceof Map ? policy.page : null
            def render = policy instanceof Map ? policy.render : null
            if (!(page instanceof String && page.contains("default-src") && render instanceof String && render.startsWith("sandbox allow-scripts"))) {
                throw new GradleException("${new File(shellAssets, 'shell-policy.json')} does not hold the shell's two policies ({page, render}): run `bun run build:web` again")
            }
        }
        if (!shellBundled && shellAssets.exists()) {
            throw new GradleException("BuildConfig.SHELL_BUNDLED is false (OVIS_APP_SHELL=hosted) and ${shellAssets} still holds a shell from another run: run `bun run build:web` with the OVIS_APP_SHELL this build is for")
        }
    }
}
tasks.configureEach { task ->
    if (task.name ==~ /merge\w*Assets/) task.dependsOn(checkHostedOrigin)
}

// A preview build (assemblePreview) is for the maintainer's own testing, never the store: an app of its own beside the
// store one, numbered by OVIS_PREVIEW_NUMBER so each installs over the last, that updates itself from
// OVIS_PREVIEW_FEED (PreviewUpdater). Only its manifest (src/preview) may hand an APK to the system installer, and
// every other build has no feed.
def previewFeed = System.getenv("OVIS_PREVIEW_FEED") ?: ""
if (previewFeed && !(previewFeed.startsWith("https://") && previewFeed.endsWith("/"))) {
    throw new GradleException("OVIS_PREVIEW_FEED must be an https folder ending in /: ${previewFeed}")
}
def previewNumber = (System.getenv("OVIS_PREVIEW_NUMBER") ?: "0") as int

android {
    namespace = "sh.ovis.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "sh.ovis.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.0.7"
        buildConfigField "String", "PREVIEW_FEED", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "APP_ORIGIN", "\"${appOrigin}\""
        buildConfigField "boolean", "HOME_HOSTED", "${homeHosted}"
        buildConfigField "boolean", "SHELL_BUNDLED", "${shellBundled}"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The Play upload key stays outside the repository: OVIS_UPLOAD_PROPERTIES names a properties
    // file with storeFile, storePassword, keyAlias and keyPassword (docs/native-app.md). Without it
    // a release build is unsigned.
    // A file that is missing or incomplete fails a release build with what is wrong, never a debug
    // build or a sync, and never signs with part of a key.
    def uploadProperties = System.getenv("OVIS_UPLOAD_PROPERTIES")
    def upload = new Properties()
    def uploadProblem = null
    if (uploadProperties) {
        def uploadFile = file(uploadProperties)
        if (!uploadFile.isFile()) {
            uploadProblem = "${uploadProperties} is not a file"
        } else {
            uploadFile.withInputStream { upload.load(it) }
            def missing = ["storeFile", "storePassword", "keyAlias", "keyPassword"].findAll { !upload.getProperty(it) }
            if (missing) uploadProblem = "${uploadProperties} lacks ${missing.join(', ')}"
            else if (!file(upload.getProperty("storeFile")).isFile()) uploadProblem = "its storeFile ${upload.getProperty('storeFile')} is not a file"
        }
    }
    if (uploadProperties && !uploadProblem) {
        signingConfigs {
            release {
                storeFile file(upload.getProperty("storeFile"))
                storePassword upload.getProperty("storePassword")
                keyAlias upload.getProperty("keyAlias")
                keyPassword upload.getProperty("keyPassword")
            }
        }
    }
    if (uploadProblem) {
        gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }) {
                throw new GradleException("OVIS_UPLOAD_PROPERTIES: ${uploadProblem}")
            }
        }
    }
    // the instrumented SSH tests (SshFixtureTest) read the same test-only keys as the JVM tests; the carried shell is
    // an assets folder of its own, which `bunx cap sync` leaves alone and Capacitor never serves at the app's origin
    sourceSets {
        androidTest.assets.srcDirs += ['src/test/resources']
        main.assets.srcDirs += ['../../bundled-shell']
    }
    buildTypes {
        release {
            if (uploadProperties && !uploadProblem) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        preview {
            initWith release
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview.${previewNumber}"
            matchingFallbacks = ['release']
            buildConfigField "String", "PREVIEW_FEED", "\"${previewFeed}\""
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("preview")) { variant ->
        variant.outputs.each { it.versionCode.set(1000 + previewNumber) }
    }
}

// The store app (its application ID in a release build) and any app bundle of any build type (an .aab, which is what
// Google Play takes: `bundle`, `bundleDebug`, `bundleRelease`, `package…Bundle`, `sign…Bundle`) carry a release's
// shell, whole: a hosted shell (OVIS_APP_SHELL=hosted) is a test build's, and a shell built from a checkout or handed
// over as a folder is no release's (shell-provenance.json, app/scripts/bundled-shell.ts). A hosted debug APK stays.
gradle.taskGraph.whenReady { graph ->
    def store = graph.allTasks.find { task ->
        task.project == project && (
            task.name ==~ /bundle([A-Z][a-z]*)?|(package|sign)[A-Z][a-z]*Bundle/ ||
                (task.name ==~ /(assemble|bundle|install|package|sign)Release(Bundle)?/ && android.defaultConfig.applicationId == "sh.ovis.app")
        )
    }
    if (!store) return
    def release = "run `bun run build:web` with OVIS_APP_SHELL_ARCHIVE=<the tag's dist-shell.tar.gz>, OVIS_APP_SHELL_SHA256=<its SHA-256> and OVIS_APP_SHELL_TAG=<the tag>, then `bunx cap sync android`"
    if (!shellBundled) {
        throw new GradleException("${store.name}: this build loads the shell from the network (OVIS_APP_SHELL=hosted, the default with OVIS_APP_URL), which neither the store app nor any app bundle does: ${release}; a test APK (assemble, install) with another application ID, or of the debug build, may stay hosted")
    }
    def provenanceFile = new File(shellAssets, "shell-provenance.json")
    def provenance = null
    try { provenance = new groovy.json.JsonSlurper().parse(provenanceFile) } catch (Exception unreadable) {}
    if (!(provenance instanceof Map) || provenance.source != "release" || !(provenance.tag ==~ /v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?/) || !(provenance.sha256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException("${store.name}: the store app carries a release's verified shell, and ${provenanceFile} says ${provenance instanceof Map ? "it is a ${provenance.source}'s" : 'nothing'}: ${release}")
    }
    def index = new File(shellAssets, "shell/index.html")
    def missing = index.isFile() ? (index.text =~ /\b(?:src|href)="\/(assets\/[^"?#]+)"/).collect { it[1] }.unique().findAll { !new File(shellAssets, "shell/${it}").isFile() } : ["index.html"]
    if (missing) {
        throw new GradleException("${store.name}: the carried shell lacks files its index.html starts with (${missing.join(', ')}), so the app would open blank: ${release}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // SSH PCs (SshLink): ConnectBot's SSH library, BSD-3-Clause
    implementation "org.connectbot:sshlib:2.2.51"
    testImplementation "junit:junit:$junitVersion"
    // android.jar's org.json throws in JVM unit tests; PCStore reads /api/health's JSON with it
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
